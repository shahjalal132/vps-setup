<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Coming Soon</title>

  <!-- FlipClock (SochavaAG build — pair CSS + JS from same source; 0.7.8 CDN + DailyCounter breaks the face) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SochavaAG/example-mycode@master/pens/1_plugins/flipclock/flipclock.css"/>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    /* ─── CSS Variables ─────────────────────────────────── */
    :root {
      --pink:   #ff0084;
      --deep:   #33001b;
      --white:  #fff;
      --muted:  rgba(255,255,255,0.45);
    }

    /* ─── Reset ─────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ─── Body / Background ─────────────────────────────── */
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #ff0084 0%, #33001b 60%, #0d0008 100%);
      font-family: 'DM Sans', sans-serif;
      color: var(--white);
      overflow: hidden;
      position: relative;
    }

    /* ─── Noise / grain overlay ─────────────────────────── */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");
      opacity: 0.04;
      pointer-events: none;
      z-index: 0;
    }

    /* ─── Glowing orb behind everything ─────────────────── */
    .orb {
      position: fixed;
      width: 600px; height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,0,132,0.35) 0%, transparent 70%);
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 0;
      animation: pulse 4s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: .7; transform: translate(-50%,-50%) scale(1); }
      50%       { opacity: 1;  transform: translate(-50%,-50%) scale(1.12); }
    }

    /* ─── Decorative lines ───────────────────────────────── */
    .deco-line {
      position: fixed;
      background: rgba(255,0,132,0.18);
      pointer-events: none; z-index: 0;
    }
    .deco-line.h { width: 100vw; height: 1px; top: 30%; }
    .deco-line.v { width: 1px; height: 100vh; left: 12%; }

    /* ─── Wrapper ────────────────────────────────────────── */
    .wrapper {
      position: relative; z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
      text-align: center;
      padding: 2rem 1rem;
      animation: fadeUp .9s cubic-bezier(.16,1,.3,1) both;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(32px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ─── Eyebrow label ──────────────────────────────────── */
    .eyebrow {
      font-size: .7rem;
      font-weight: 500;
      letter-spacing: .28em;
      text-transform: uppercase;
      color: var(--pink);
      background: rgba(255,0,132,.12);
      border: 1px solid rgba(255,0,132,.3);
      padding: .35rem 1.1rem;
      border-radius: 50px;
      margin-bottom: 1.8rem;
      animation: fadeUp .9s .15s cubic-bezier(.16,1,.3,1) both;
    }

    /* ─── Main Title ─────────────────────────────────────── */
    h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(3rem, 5vw, 8rem);
      line-height: .95;
      letter-spacing: .02em;
      color: var(--pink);
      text-shadow: 0 0 60px rgba(255,0,132,.5), 0 2px 0 rgba(0,0,0,.4);
      margin-bottom: 2.4rem;
      animation: fadeUp .9s .25s cubic-bezier(.16,1,.3,1) both;
    }
    h1 span { color: var(--white); }

    /* ─── Divider ────────────────────────────────────────── */
    .divider {
      width: 60px; height: 2px;
      background: var(--pink);
      margin: 0 auto 2.4rem;
      box-shadow: 0 0 12px var(--pink);
      animation: fadeUp .9s .35s cubic-bezier(.16,1,.3,1) both;
    }

    /* ─── FlipClock container ────────────────────────────── */
    .ag-format-container {
      width: 1142px;
      margin: 0 auto;
    }
    .js-ag-show.flip-clock-wrapper ul li a div div.inn {
      color: #ccc612 !important;
      text-shadow: 0 1px 2px #1508f0 !important;
      background: #252ed3 !important;
      border-color: rgba(37, 46, 211, 0.6) !important;
    }
    .js-ag-show .flip-clock-dot {
      background: #252ed3 !important;
      box-shadow: none !important;
    }

    .ag-flipclock-block {
      padding: 50px 0;
      animation: fadeUp .9s .45s cubic-bezier(.16,1,.3,1) both;
    }
    .flip-clock-wrapper {
      display: table;
      width: auto;
      margin: 0 auto;
    }

    /* Override flipclock colours ─────────────────────────── */
    .flip-clock-wrapper ul li a div div.inn {
      color: #fff !important;
      text-shadow: 0 1px 4px rgba(0,0,0,.6) !important;
      background: linear-gradient(180deg, #3a0020 0%, #1c000f 100%) !important;
      border: 1px solid rgba(255,0,132,.25) !important;
    }
    .flip-clock-wrapper ul li a div.up:after {
      background: rgba(0,0,0,.3) !important;
    }
    .flip-clock-dot {
      background: var(--pink) !important;
      box-shadow: 0 0 6px var(--pink) !important;
    }
    .flip-clock-divider .flip-clock-label {
      color: var(--muted) !important;
      font-family: 'DM Sans', sans-serif !important;
      font-size: .65rem !important;
      letter-spacing: .15em !important;
      text-transform: uppercase !important;
    }
    /* Keep default line-height from flipclock.css (87px) so digits sit inside 90px cells */

    /* ─── Domain text ────────────────────────────────────── */
    .domain {
      margin-top: .4rem;
      font-size: .78rem;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: var(--muted);
      animation: fadeUp .9s .6s cubic-bezier(.16,1,.3,1) both;
    }
    .domain a {
      color: var(--white);
      text-decoration: none;
      transition: color .2s;
    }
    .domain a:hover { color: var(--white); }

    /* ─── Responsive (CodePen / Sochava layout) ────────────── */
    @media only screen and (max-width: 767px) {
      .ag-format-container { width: 96%; }
    }
    @media only screen and (max-width: 639px) {
      .flip-clock-wrapper ul { width: 50px; }
      .flip-clock-divider .flip-clock-label { right: -75px; }
    }
    @media only screen and (max-width: 479px) {
      .flip-clock-wrapper ul { height: 70px; width: 30px; }
      .flip-clock-wrapper ul li { line-height: 70px; }
      .flip-clock-divider .flip-clock-label,
      .flip-clock-divider.minutes .flip-clock-label,
      .flip-clock-divider.seconds .flip-clock-label { right: -60px; }
      .flip-clock-wrapper ul li a div div.inn { font-size: 44px; }
      .flip-clock-divider { height: 80px; }
      .flip-clock-dot.top { top: 20px; }
      .flip-clock-dot.bottom { bottom: 20px; }
    }
    @media (min-width: 768px) and (max-width: 979px) {
      .ag-format-container { width: 750px; }
    }
    @media (min-width: 980px) and (max-width: 1161px) {
      .ag-format-container { width: 960px; }
    }
  </style>
</head>
<body>

  <div class="orb"></div>
  <div class="deco-line h"></div>
  <div class="deco-line v"></div>

  <div class="wrapper">

    <div class="eyebrow">We are almost ready</div>

    <h1>Something amazing<br>is <span>coming soon.</span></h1>

    <div class="divider"></div>

    <!-- ── FlipClock ── -->
    <div class="ag-flipclock-block">
      <div class="ag-format-container">
        <div class="js-flipclock"></div>
      </div>
    </div>

    <p class="domain">Stay tuned &nbsp;·&nbsp; <a href="https://yourdomain.com">yourdomain.com</a></p>

  </div>

  <!-- jQuery + FlipClock (same stack as CodePen — SochavaAG flipclock) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/1.11.1/jquery.min.js"></script>
  <script src="https://raw.githack.com/SochavaAG/example-mycode/master/pens/1_plugins/flipclock/flipclock.min.js"></script>

  <script>
    // ─────────────────────────────────────────────────────────────
    //  COUNTDOWN — REMAINING_DAY is the window length; end time is
    //  stored on first visit (localStorage, cookie fallback) so reloads
    //  continue the same countdown. Change REMAINING_DAY or bump
    //  STORAGE_VERSION to start a fresh window.
    // ─────────────────────────────────────────────────────────────
    var REMAINING_DAY = 2;
    var STORAGE_KEY = 'coming_soon_countdown';
    var STORAGE_VERSION = 1;

    function readStoredState() {
      var raw = null;
      try {
        raw = localStorage.getItem(STORAGE_KEY);
      } catch (e) {}
      if (!raw) {
        var match = document.cookie.match(new RegExp('(?:^|; )' + STORAGE_KEY + '=([^;]*)'));
        if (match) {
          try {
            raw = decodeURIComponent(match[1]);
          } catch (e2) {}
        }
      }
      if (!raw) return null;
      try {
        return JSON.parse(raw);
      } catch (e) {
        return null;
      }
    }

    function writeStoredState(obj) {
      var raw = JSON.stringify(obj);
      try {
        localStorage.setItem(STORAGE_KEY, raw);
      } catch (e) {}
      var maxAge = 400 * 24 * 60 * 60;
      document.cookie = STORAGE_KEY + '=' + encodeURIComponent(raw) + ';path=/;max-age=' + maxAge + ';SameSite=Lax';
    }

    function getOrCreateCountdownEndMs() {
      var now = Date.now();
      var durationMs = REMAINING_DAY * 24 * 60 * 60 * 1000;
      var data = readStoredState();
      if (data && data.v === STORAGE_VERSION && data.days === REMAINING_DAY && typeof data.end === 'number') {
        if (data.end > now) return data.end;
      }
      var end = now + durationMs;
      writeStoredState({ v: STORAGE_VERSION, days: REMAINING_DAY, end: end });
      return end;
    }

    var countdownEndMs = getOrCreateCountdownEndMs();

    (function ($) {
      $(function () {

        function secondsUntilEnd() {
          var diff = Math.floor((countdownEndMs - Date.now()) / 1000);
          return diff > 0 ? diff : 0;
        }

        function agChangeResize() {
          var $clock = $('.js-flipclock');
          if (window.innerWidth > 480) {
            $clock.removeClass('js-ag-show');
          } else {
            $clock.addClass('js-ag-show');
          }
        }

        function agStartFlipClock() {
          $('.js-flipclock').FlipClock(secondsUntilEnd(), {
            clockFace: 'DailyCounter',
            countdown: true
          });
          return true;
        }

        agStartFlipClock();
        agChangeResize();
        $(window).resize(function () {
          agChangeResize();
        });
      });
    })(jQuery);
  </script>
</body>
</html>
